[package]
name = "coffe"
version = "0.1.0"
description = "Coffe, your local-first IDE Agentic Coding workspace."
authors = ["Coffe contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "coffe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
